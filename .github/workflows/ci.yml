name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check alecto tests conftest.py

      - name: Tests
        run: python -m pytest tests -q

      - name: CLI smoke test (offline)
        run: |
          python -m alecto self-test
          python -m alecto run --target mock --benchmark math_basic --data-dir "$RUNNER_TEMP/alecto-ci"
          python -m alecto list --data-dir "$RUNNER_TEMP/alecto-ci"

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the package version matches the repository
        run: |
          python - <<'PY'
          import glob, tomllib, zipfile
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith(f"alecto-{version}") for n in names), names[:3]
          # Bundled fixtures must ship with the package.
          for resource in ("quality_samples.json", "refusal_catalog.jsonl"):
              assert any(n.endswith(resource) for n in names), f"missing {resource}"
          print(f"wheel OK at version {version} with bundled resources")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
